simulate_ride:
  name: Simulate a ride
  description: Replay phone fixes through a copy of the matcher. Does not change the live riding sensor.
  fields:
    entry_id:
      name: Config entry
      required: true
      selector:
        text:
    fixes:
      name: Fixes
      required: true
      selector:
        object:
    trainview:
      name: TrainView rows
      selector:
        object:
    rider:
      name: Rider
      description: Person, tracker, slug, or a Going Home / Day Trains entity id. The old unsuffixed ids still work. Blank uses the primary rider. Does not change live state.
      selector:
        text:
    expected_train:
      name: Expected train
      description: Train number the replay should prefer. Does not change live state.
      selector:
        text:

refresh_trips:
  name: Refresh trips
  description: Fetch NextToArrive again for configured origin-to-destination trips.
  fields:
    entry_id:
      name: Config entry
      selector:
        text:
    trip_id:
      name: Trip
      description: One trip id. Blank refreshes every configured trip.
      selector:
        text:

set_expected_train:
  name: Set expected train
  description: Prefer this train when matching a ride. A blank train clears the hint. The service wins over an expected-train entity.
  fields:
    entry_id:
      name: Config entry
      selector:
        text:
    rider:
      name: Rider
      description: Person, tracker, slug, or a Going Home / Day Trains entity id. The old unsuffixed ids still work. Blank uses the primary rider.
      selector:
        text:
    train:
      name: Train
      description: Train number. Blank clears the hint.
      selector:
        text:
    origin:
      name: Origin
      selector:
        text:
    destination:
      name: Destination
      selector:
        text:
    connection_train:
      name: Connection train
      selector:
        text:
    connection_station:
      name: Connection station
      selector:
        text:
    valid_until:
      name: Valid until
      description: ISO time. Blank uses three hours, or the scheduled arrival plus an hour when the card sends one.
      selector:
        text:

set_origin_station:
  name: Set origin station
  description: Hold a Going Home origin until you clear it or the rider gets home. A blank station returns to automatic.
  fields:
    entry_id:
      name: Config entry
      selector:
        text:
    rider:
      name: Rider
      description: Person, tracker, slug, or a Going Home / Day Trains entity id. The old unsuffixed ids still work. Blank uses the primary rider.
      selector:
        text:
    station:
      name: Station
      description: Regional Rail station. Blank clears the manual origin.
      selector:
        text:

set_destination:
  name: Set destination
  description: Hold the day-trains destination. A blank station returns to the calendar, entity, or default.
  fields:
    entry_id:
      name: Config entry
      selector:
        text:
    rider:
      name: Rider
      description: Person, tracker, slug, or a Going Home / Day Trains entity id. The old unsuffixed ids still work. Blank uses the primary rider.
      selector:
        text:
    station:
      name: Station
      description: Regional Rail station. Blank clears the manual destination.
      selector:
        text:
